name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build macOS (x64 + arm64)
        run: npx electron-builder --mac --x64 --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jindun-browser-mac
          path: |
            dist-build-332564148/*.dmg
            dist-build-332564148/*.zip
          retention-days: 30
